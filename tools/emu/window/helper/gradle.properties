# The same daemon settings as the app's build (../../../../gradle.properties), so that a daemon that
# is already running for this machine's builds is reused.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
# Java only: no Kotlin compiler and no Kotlin standard library in the APK (see build.gradle.kts).
android.builtInKotlin=false
