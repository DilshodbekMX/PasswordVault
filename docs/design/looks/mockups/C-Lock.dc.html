<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lock screen in night vault</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#F2B84B}a:hover{color:#FFD58A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #0E1216; color: #E3E6EA; font-family: Roboto, system-ui, sans-serif; overflow: hidden">
<div style="padding: 88px 24px 24px; display: flex; flex-direction: column; align-items: center; gap: 10px">
<div style="width: 64px; height: 64px; border-radius: 20px; background: #161C21; box-shadow: inset 0 0 0 1.5px #6B5320; display: flex; align-items: center; justify-content: center">
<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#F2B84B" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><circle cx="12" cy="12" r="2.6"></circle><path d="M12 3.5v3M12 17.5v3M3.5 12h3M17.5 12h3M6 6l2.1 2.1M15.9 15.9L18 18M6 18l2.1-2.1M15.9 8.1L18 6"></path></svg>
</div>
<div style="font-size: 24px; font-weight: 500; margin-top: 8px">PasswordVault</div>
<div style="font-size: 16px; color: #A7AFB8">Enter your app PIN</div>
<div role="img" aria-label="PIN, 3 of 6 digits entered" style="display: flex; gap: 18px; margin-top: 26px">
<span style="width: 14px; height: 14px; border-radius: 50%; background: #F2B84B"></span>
<span style="width: 14px; height: 14px; border-radius: 50%; background: #F2B84B"></span>
<span style="width: 14px; height: 14px; border-radius: 50%; background: #F2B84B"></span>
<span style="width: 14px; height: 14px; border-radius: 50%; box-shadow: inset 0 0 0 2px #5B636C"></span>
<span style="width: 14px; height: 14px; border-radius: 50%; box-shadow: inset 0 0 0 2px #5B636C"></span>
<span style="width: 14px; height: 14px; border-radius: 50%; box-shadow: inset 0 0 0 2px #5B636C"></span>
</div>
</div>
<div style="flex-grow: 1; display: flex; align-items: center; justify-content: center">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 30px">
<sc-for list="{{digits}}" as="d" hint-placeholder-count="9">
<button type="button" style="width: 72px; height: 72px; border: 1.5px solid #333C45; border-radius: 50%; background: transparent; color: #E3E6EA; font-family: inherit; font-size: 28px">{{d}}</button>
</sc-for>
<button type="button" aria-label="Use fingerprint" style="width: 72px; height: 72px; border: 0; border-radius: 50%; background: transparent; color: #F2B84B; display: flex; align-items: center; justify-content: center">
<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.5 4.6A8.5 8.5 0 0 1 20.2 10"></path><path d="M4 9.2a8.5 8.5 0 0 1 1.6-2.9"></path><path d="M12 7.5a4.5 4.5 0 0 1 4.5 4.5c0 2.6-.4 5.1-1.2 7.4"></path><path d="M7.5 12a4.5 4.5 0 0 1 2.2-3.9"></path><path d="M7.5 12c0 2-.4 3.9-1.2 5.6"></path><path d="M12 11.5c0 3.2-.7 6.2-2 8.9"></path><path d="M20.4 13.5c-.1 1.5-.4 3-.8 4.4"></path></svg>
</button>
<button type="button" style="width: 72px; height: 72px; border: 1.5px solid #333C45; border-radius: 50%; background: transparent; color: #E3E6EA; font-family: inherit; font-size: 28px">0</button>
<button type="button" aria-label="Delete last digit" style="width: 72px; height: 72px; border: 0; border-radius: 50%; background: transparent; color: #A7AFB8; display: flex; align-items: center; justify-content: center">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"></path><path d="M12.5 9.5l5 5M17.5 9.5l-5 5"></path></svg>
</button>
</div>
</div>
<div style="display: flex; justify-content: center; padding: 0 0 32px">
<button type="button" style="border: 0; background: transparent; color: #F2B84B; font-family: inherit; font-size: 15px; font-weight: 500; padding: 12px 18px; border-radius: 20px">Forgot PIN? Use master password</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { digits: ['1', '2', '3', '4', '5', '6', '7', '8', '9'] };
  }
}
</script>
</body>
</html>
